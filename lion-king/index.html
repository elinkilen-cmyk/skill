<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>🦁 Simba's Adventure</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#1a0800;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:system-ui,sans-serif}
canvas{border-radius:10px;box-shadow:0 8px 40px rgba(0,0,0,0.8);max-width:100%;display:block}
#dpad{margin-top:14px;display:flex;align-items:center;gap:12px}
.dk{width:58px;height:58px;background:rgba(255,255,255,0.1);border:2px solid rgba(255,255,255,0.2);border-radius:10px;color:#fff;font-size:22px;display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none;touch-action:none}
.dk:active{background:rgba(255,255,255,0.25)}
</style>
</head>
<body>
<canvas id="c" width="800" height="420"></canvas>
<div id="dpad">
  <div class="dk" id="dl">◀</div>
  <div class="dk" id="dj" style="font-size:18px">▲<br><small>HOPP</small></div>
  <div class="dk" id="dr">▶</div>
</div>
<script>
const C=document.getElementById('c'),ctx=C.getContext('2d');
const W=800,H=420,LW=5000,GY=360;
const GRAV=0.55,JV=-13.5,SPD=4.5,MF=15;

// Input
const keys={},touch={l:0,r:0,j:0};
addEventListener('keydown',e=>{keys[e.code]=1;['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)&&e.preventDefault()});
addEventListener('keyup',e=>{keys[e.code]=0});
function held(a){return a==='l'?keys.ArrowLeft||keys.KeyA||touch.l:a==='r'?keys.ArrowRight||keys.KeyD||touch.r:keys.Space||keys.ArrowUp||keys.KeyW||touch.j}
['dl','dr','dj'].forEach(id=>{const el=document.getElementById(id),k=id[1]==='l'?'l':id[1]==='r'?'r':'j';el.addEventListener('pointerdown',e=>{e.preventDefault();touch[k]=1});el.addEventListener('pointerup',()=>touch[k]=0);el.addEventListener('pointerleave',()=>touch[k]=0)});

// Platforms
const PLAT=[
  {x:0,y:GY,w:900,h:60},{x:1080,y:GY,w:520,h:60},{x:1760,y:GY,w:600,h:60},
  {x:2540,y:GY,w:560,h:60},{x:3300,y:GY,w:520,h:60},{x:4000,y:GY,w:1000,h:60},
  // bridges
  {x:860,y:310,w:270,h:18},{x:1650,y:305,w:165,h:18},{x:2430,y:308,w:175,h:18},
  {x:3180,y:308,w:180,h:18},{x:3860,y:308,w:200,h:18},
  // floating
  {x:200,y:288,w:150,h:18},{x:460,y:248,w:130,h:18},{x:680,y:290,w:140,h:18},
  {x:1120,y:268,w:130,h:18},{x:1320,y:228,w:120,h:18},{x:1500,y:278,w:140,h:18},
  {x:1820,y:282,w:150,h:18},{x:2050,y:248,w:130,h:18},{x:2240,y:295,w:140,h:18},
  {x:2600,y:278,w:140,h:18},{x:2820,y:238,w:130,h:18},{x:3020,y:290,w:150,h:18},
  {x:3360,y:268,w:140,h:18},{x:3580,y:228,w:130,h:18},{x:3740,y:282,w:150,h:18},
  {x:4100,y:278,w:150,h:18},{x:4340,y:238,w:130,h:18},{x:4580,y:278,w:140,h:18},
];

// Hyenas
const HY=[
  {x:480,y:GY-42,w:50,h:42,sp:1.5,dir:1,alive:true,lo:50,hi:870},
  {x:1150,y:GY-42,w:50,h:42,sp:1.8,dir:1,alive:true,lo:1080,hi:1580},
  {x:1900,y:GY-42,w:50,h:42,sp:1.5,dir:-1,alive:true,lo:1760,hi:2340},
  {x:2680,y:GY-42,w:50,h:42,sp:2,dir:1,alive:true,lo:2540,hi:3100},
  {x:3450,y:GY-42,w:50,h:42,sp:1.5,dir:1,alive:true,lo:3300,hi:3820},
  {x:4300,y:GY-42,w:50,h:42,sp:2,dir:-1,alive:true,lo:4000,hi:4850},
  {x:215,y:244,w:50,h:42,sp:1.5,dir:1,alive:true,lo:200,hi:340},
  {x:475,y:204,w:50,h:42,sp:1.5,dir:1,alive:true,lo:460,hi:580},
  {x:1335,y:184,w:50,h:42,sp:1.5,dir:-1,alive:true,lo:1320,hi:1440},
  {x:2065,y:204,w:50,h:42,sp:1.5,dir:1,alive:true,lo:2050,hi:2175},
  {x:3595,y:184,w:50,h:42,sp:1.5,dir:-1,alive:true,lo:3580,hi:3700},
];

// Bugs (collectibles)
const BUGS=[];
[[240,262],[290,262],[470,222],[520,222],[700,264],[760,264],
 [1130,242],[1180,242],[1335,202],[1510,252],[1550,252],
 [1840,256],[1890,256],[2065,222],[2110,222],[2260,268],
 [2620,252],[2660,252],[2840,212],[2880,212],[3040,264],
 [3375,242],[3595,202],[3760,256],[4120,252],[4360,212],[4600,252],
 [120,334],[180,334],[240,334],[1100,334],[1160,334],[1780,334],
 [2560,334],[2620,334],[3320,334],[3380,334],[4020,334],[4080,334]
].forEach(([x,y])=>BUGS.push({x,y,got:false}));

const GOALX=4820;

// State
let phase='start',lives=3,score=0,popups=[],frame=0,jWas=false,deathT=0,camX=0;
let s={x:100,y:GY-55,w:46,h:55,vx:0,vy:0,gnd:false,dir:1,inv:0};

function resetS(){s={x:100,y:GY-55,w:46,h:55,vx:0,vy:0,gnd:false,dir:1,inv:90};camX=0}
function startGame(){
  lives=3;score=0;popups=[];frame=0;jWas=false;deathT=0;
  HY.forEach(h=>{h.alive=true;h.x=h.lo+30;h.dir=1});
  BUGS.forEach(b=>b.got=false);
  resetS();phase='play';
}

function ox(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x}
function oy(a,b){return a.y<b.y+b.h&&a.y+a.h>b.y}

function resolveX(e){
  for(const p of PLAT){
    if(!ox(e,p)||!oy(e,p))continue;
    if(e.vx>0&&e.x+e.w-e.vx<=p.x+2){e.x=p.x-e.w;e.vx=0}
    else if(e.vx<0&&e.x-e.vx>=p.x+p.w-2){e.x=p.x+p.w;e.vx=0}
  }
}
function resolveY(e){
  e.gnd=false;
  for(const p of PLAT){
    if(!ox(e,p)||!oy(e,p))continue;
    if(e.vy>=0&&e.y+e.h-e.vy<=p.y+5){e.y=p.y-e.h;e.vy=0;e.gnd=true}
    else if(e.vy<0&&e.y-e.vy>=p.y+p.h-5){e.y=p.y+p.h;e.vy=0}
  }
}

function die(){deathT=70;s.vy=-11;s.vx=s.dir*-2;phase='dying'}

function update(){
  frame++;
  if(phase==='dying'){
    deathT--;s.vy=Math.min(s.vy+GRAV,MF);s.y+=s.vy;s.x+=s.vx;
    if(deathT<=0){lives--;if(lives<=0){phase='gameover';return}resetS();phase='play'}
    return;
  }
  if(phase!=='play')return;
  const wl=held('l'),wr=held('r'),wj=held('j');
  if(wl){s.vx=-SPD;s.dir=-1}else if(wr){s.vx=SPD;s.dir=1}else s.vx*=0.65;
  if(wj&&!jWas&&s.gnd)s.vy=JV;
  jWas=wj;
  s.x=Math.max(0,s.x+s.vx);resolveX(s);
  s.vy=Math.min(s.vy+GRAV,MF);s.y+=s.vy;resolveY(s);
  if(s.y>H+100){die();return}
  camX=Math.max(0,Math.min(s.x-W/3,LW-W));
  if(s.inv>0)s.inv--;
  for(const h of HY){
    if(!h.alive)continue;
    h.x+=h.sp*h.dir;if(h.x<=h.lo||h.x+h.w>=h.hi)h.dir*=-1;
    if(s.inv>0||!ox(s,h)||!oy(s,h))continue;
    if(s.vy>0&&s.y+s.h<h.y+h.h*0.6){
      h.alive=false;s.vy=-10;score+=50;
      popups.push({wx:h.x+h.w/2,wy:h.y-10,txt:'+50',life:50});
    }else{die();return}
  }
  for(const b of BUGS){
    if(b.got)continue;
    if(Math.abs(s.x+s.w/2-b.x)<22&&Math.abs(s.y+s.h/2-b.y)<22){
      b.got=true;score+=10;popups.push({wx:b.x,wy:b.y-12,txt:'+10',life:45});
    }
  }
  if(s.x+s.w>GOALX&&s.gnd)phase='win';
  popups=popups.filter(p=>{p.wy-=1;p.life--;return p.life>0});
}

// Drawing helpers
function rr(x,y,w,h,r){
  ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.arcTo(x+w,y,x+w,y+r,r);
  ctx.lineTo(x+w,y+h-r);ctx.arcTo(x+w,y+h,x+w-r,y+h,r);
  ctx.lineTo(x+r,y+h);ctx.arcTo(x,y+h,x,y+h-r,r);
  ctx.lineTo(x,y+r);ctx.arcTo(x,y,x+r,y,r);ctx.closePath();ctx.fill();
}

function drawBG(){
  const sky=ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'#8b1a00');sky.addColorStop(0.4,'#cc5500');
  sky.addColorStop(0.7,'#f08020');sky.addColorStop(1,'#f5c040');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
  // Sun
  const sx=W*0.75-(camX*0.04)%W;
  ctx.fillStyle='rgba(255,230,50,0.2)';ctx.beginPath();ctx.arc(sx,65,75,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='rgba(255,215,30,0.8)';ctx.beginPath();ctx.arc(sx,65,50,0,Math.PI*2);ctx.fill();
  // Hills (parallax)
  ctx.fillStyle='#6a2000';
  const ho=-(camX*0.15)%700;
  for(let i=-1;i<3;i++){const hx=i*700+ho;ctx.beginPath();ctx.moveTo(hx,GY);ctx.bezierCurveTo(hx+150,GY-120,hx+300,GY-150,hx+350,GY-80);ctx.bezierCurveTo(hx+400,GY-140,hx+550,GY-100,hx+700,GY);ctx.fill()}
  // Trees (parallax)
  ctx.fillStyle='#3d1400';
  const to=-(camX*0.2)%500;
  for(let i=-1;i<5;i++){const tx=i*500+to+80,ty=GY;ctx.fillRect(tx-4,ty-85,8,85);ctx.beginPath();ctx.ellipse(tx,ty-85,50,20,0,0,Math.PI*2);ctx.fill()}
}

function drawWorld(){
  for(const p of PLAT){
    const sx=p.x-camX;if(sx+p.w<0||sx>W)continue;
    if(p.h>30){ctx.fillStyle='#6b3800';ctx.fillRect(sx,p.y,p.w,p.h);ctx.fillStyle='#a05a10';ctx.fillRect(sx,p.y,p.w,10)}
    else{ctx.fillStyle='#804010';rr(sx,p.y,p.w,p.h,5);ctx.fillStyle='#b07030';ctx.fillRect(sx,p.y,p.w,6)}
  }
}

function drawPrideRock(){
  const rx=GOALX-camX-130;if(rx>W+250||rx<-350)return;
  ctx.fillStyle='#5a2008';
  ctx.beginPath();ctx.moveTo(rx,GY);ctx.lineTo(rx-20,GY-70);ctx.lineTo(rx+40,GY-120);
  ctx.lineTo(rx+130,GY-150);ctx.lineTo(rx+220,GY-115);ctx.lineTo(rx+270,GY-60);ctx.lineTo(rx+290,GY);ctx.closePath();ctx.fill();
  ctx.fillStyle='#7a3818';
  ctx.beginPath();ctx.moveTo(rx+50,GY-108);ctx.lineTo(rx+130,GY-142);ctx.lineTo(rx+210,GY-108);ctx.lineTo(rx+160,GY-90);ctx.lineTo(rx+70,GY-92);ctx.closePath();ctx.fill();
  const gx=rx+130,gy=GY-155;
  ctx.fillStyle=`rgba(255,210,0,${0.5+0.3*Math.sin(frame/12)})`;
  ctx.beginPath();ctx.arc(gx,gy,14+4*Math.sin(frame/9),0,Math.PI*2);ctx.fill();
  if(s.x>GOALX-600){
    ctx.globalAlpha=0.4+0.2*Math.sin(frame/16);
    ctx.fillStyle='#ffd700';ctx.font='bold 13px serif';ctx.textAlign='center';
    ctx.fillText('Remember who you are...',gx,gy-45);ctx.globalAlpha=1;
  }
}

function drawBugs(){
  for(const b of BUGS){
    if(b.got)continue;const bx=b.x-camX;if(bx<-20||bx>W+20)continue;
    ctx.save();ctx.translate(bx,b.y);
    ctx.fillStyle=`rgba(80,200,40,${0.4+0.3*Math.sin(frame*0.12)})`;
    ctx.beginPath();ctx.arc(0,0,10,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#287010';ctx.beginPath();ctx.ellipse(0,0,6,8,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='rgba(120,220,70,0.7)';
    ctx.beginPath();ctx.ellipse(-7,-2,5,3,-0.4,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(7,-2,5,3,0.4,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-2.5,-4,2,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(2.5,-4,2,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#111';ctx.beginPath();ctx.arc(-2.5,-4,1,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(2.5,-4,1,0,Math.PI*2);ctx.fill();
    ctx.restore();
  }
}

function drawHyenas(){
  for(const h of HY){
    if(!h.alive)continue;const hx=h.x-camX;if(hx>W+80||hx<-80)continue;
    const bob=Math.sin(frame*0.2)*2;
    ctx.save();ctx.translate(hx+h.w/2,h.y+h.h/2);if(h.dir>0)ctx.scale(-1,1);
    ctx.fillStyle='#808070';
    ctx.beginPath();ctx.moveTo(-24,14);ctx.bezierCurveTo(-22,-8+bob,-6,-14+bob,10,-12+bob);ctx.bezierCurveTo(24,-8+bob,26,5,24,14);ctx.closePath();ctx.fill();
    ctx.fillStyle='rgba(40,40,30,0.45)';
    [[-10,2+bob],[2,-6+bob],[14,2+bob]].forEach(([dx,dy])=>{ctx.beginPath();ctx.ellipse(dx,dy,4,3,0,0,Math.PI*2);ctx.fill()});
    ctx.fillStyle='#808070';ctx.fillRect(-18,12,11,14+bob);ctx.fillRect(10,12,11,14-bob);
    ctx.fillStyle='#909080';ctx.beginPath();ctx.arc(26,-4+bob,13,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#6a6a5a';ctx.beginPath();ctx.ellipse(36,1+bob,8,6,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#aaa';
    ctx.beginPath();ctx.moveTo(17,-14+bob);ctx.lineTo(12,-22+bob);ctx.lineTo(23,-19+bob);ctx.fill();
    ctx.beginPath();ctx.moveTo(28,-13+bob);ctx.lineTo(25,-21+bob);ctx.lineTo(35,-17+bob);ctx.fill();
    ctx.fillStyle='#0a0400';ctx.beginPath();ctx.arc(21,-6+bob,3,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(30,-6+bob,3,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#ff6000';ctx.beginPath();ctx.arc(21.5,-6.5+bob,1.2,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(30.5,-6.5+bob,1.2,0,Math.PI*2);ctx.fill();
    ctx.restore();
  }
}

function drawSimba(){
  if(s.inv>0&&Math.floor(s.inv/4)%2===1)return;
  const lb=s.gnd?Math.sin(frame*0.28)*5:0;
  ctx.save();ctx.translate(s.x-camX+s.w/2,s.y+s.h/2);if(s.dir<0)ctx.scale(-1,1);
  // Shadow
  ctx.fillStyle='rgba(0,0,0,0.18)';ctx.beginPath();ctx.ellipse(0,s.h/2,16,5,0,0,Math.PI*2);ctx.fill();
  // Tail
  ctx.strokeStyle='#a85818';ctx.lineWidth=4;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(-20,8);ctx.quadraticCurveTo(-36,20+Math.sin(frame*0.14)*6,-32,32);ctx.stroke();
  ctx.fillStyle='#602808';ctx.beginPath();ctx.arc(-32,34,5,0,Math.PI*2);ctx.fill();
  // Legs
  ctx.fillStyle='#be6a1e';ctx.fillRect(-14,8,11,16+lb);ctx.fillRect(5,8,11,16-lb);
  // Body
  ctx.fillStyle='#d06828';rr(-20,-14,40,30,8);
  ctx.fillStyle='#eda048';rr(-12,-4,24,20,7);
  // Head
  ctx.fillStyle='#d06828';ctx.beginPath();ctx.arc(8,-20,17,0,Math.PI*2);ctx.fill();
  // Mane tuft
  ctx.fillStyle='#904c16';ctx.beginPath();ctx.arc(8,-22,12,Math.PI*0.75,Math.PI*1.85);ctx.fill();
  // Ears
  ctx.fillStyle='#d06828';
  ctx.beginPath();ctx.moveTo(-1,-34);ctx.lineTo(-10,-43);ctx.lineTo(7,-43);ctx.fill();
  ctx.beginPath();ctx.moveTo(14,-34);ctx.lineTo(6,-43);ctx.lineTo(23,-43);ctx.fill();
  ctx.fillStyle='#f09080';
  ctx.beginPath();ctx.moveTo(-1,-35);ctx.lineTo(-7,-41);ctx.lineTo(5,-41);ctx.fill();
  ctx.beginPath();ctx.moveTo(14,-35);ctx.lineTo(8,-41);ctx.lineTo(20,-41);ctx.fill();
  // Snout
  ctx.fillStyle='#eda048';ctx.beginPath();ctx.ellipse(8,-13,10,8,0,0,Math.PI*2);ctx.fill();
  // Eyes
  ctx.fillStyle='#180800';ctx.beginPath();ctx.arc(3,-22,3.5,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(13,-22,3.5,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(4,-23,1,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(14,-23,1,0,Math.PI*2);ctx.fill();
  // Nose
  ctx.fillStyle='#7a1818';ctx.beginPath();ctx.moveTo(5,-14);ctx.lineTo(11,-14);ctx.lineTo(8,-11);ctx.fill();
  // Smile
  ctx.strokeStyle='#8a3018';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(8,-9,4,0.1,Math.PI-0.1);ctx.stroke();
  ctx.restore();
}

function drawHUD(){
  ctx.fillStyle='rgba(0,0,0,0.5)';rr(8,8,150,40,8);
  ctx.fillStyle='#ffd700';ctx.font='bold 20px system-ui';ctx.textAlign='left';ctx.textBaseline='middle';
  ctx.fillText('🦁'.repeat(Math.max(0,lives)),16,28);
  ctx.fillStyle='rgba(0,0,0,0.5)';rr(W-160,8,152,40,8);
  ctx.fillStyle='#ffd700';ctx.font='bold 18px system-ui';ctx.textAlign='right';ctx.fillText('🐛 '+score,W-14,28);
}

function drawPopups(){
  popups.forEach(p=>{
    ctx.globalAlpha=p.life/50;ctx.fillStyle='#ffd700';ctx.font='bold 16px system-ui';
    ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(p.txt,p.wx-camX,p.wy);
  });ctx.globalAlpha=1;
}

function drawScreen(title,col,sub,scoreTxt,btn){
  ctx.fillStyle='rgba(0,0,0,0.72)';ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillStyle=col;ctx.font='bold 42px serif';ctx.fillText(title,W/2,H/2-80);
  ctx.fillStyle='#ffcc66';ctx.font='22px serif';ctx.fillText(sub,W/2,H/2-28);
  if(scoreTxt){ctx.fillStyle='#ffd700';ctx.font='bold 24px system-ui';ctx.fillText(scoreTxt,W/2,H/2+18)}
  ctx.fillStyle='#40b840';rr(W/2-95,H/2+52,190,50,10);
  ctx.fillStyle='#fff';ctx.font='bold 21px system-ui';ctx.fillText(btn,W/2,H/2+77);
}

C.addEventListener('click',e=>{
  if(!['start','win','gameover'].includes(phase))return;
  const r=C.getBoundingClientRect(),mx=(e.clientX-r.left)*(W/r.width),my=(e.clientY-r.top)*(H/r.height);
  if(mx>W/2-95&&mx<W/2+95&&my>H/2+52&&my<H/2+102)startGame();
});

function loop(){
  requestAnimationFrame(loop);update();
  drawBG();drawPrideRock();drawWorld();drawBugs();drawHyenas();
  if(phase!=='start')drawSimba();
  drawHUD();drawPopups();
  if(phase==='start')drawScreen("🦁 Simba's Adventure",'#ffd700','Hjelp Simba nå Pride Rock!','Hopp på hyenene · samle larver 🐛','Spill!');
  if(phase==='win')drawScreen('Hakuna Matata! 🎉','#ffd700','Simba nådde Pride Rock!','Score: '+score,'Spill igjen ↺');
  if(phase==='gameover')drawScreen('Game Over','#ff4444','Scar vant denne gangen...','Score: '+score,'Prøv igjen ↺');
}
loop();
</script>
</body>
</html>
