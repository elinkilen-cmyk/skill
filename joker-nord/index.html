<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Joker Nord</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0a0a1a; color: #fff; font-family: 'Segoe UI', sans-serif; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }

  #topbar {
    background: linear-gradient(135deg, #1a1a3e, #2d1b69);
    border-bottom: 2px solid #7c3aed;
    padding: 10px 16px;
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  }
  #logo { font-size: 22px; font-weight: 900; color: #f59e0b; text-shadow: 0 0 20px #f59e0b; letter-spacing: 1px; white-space: nowrap; }
  #score-box { font-size: 20px; font-weight: 700; color: #10b981; margin-left: auto; white-space: nowrap; }
  #timer-box { font-size: 20px; font-weight: 700; color: #f87171; white-space: nowrap; }

  #rules-bar {
    background: #111130;
    padding: 6px 14px;
    display: flex; gap: 6px; flex-wrap: wrap; min-height: 36px; align-items: center;
  }
  #rules-label { font-size: 11px; color: #888; white-space: nowrap; }
  .rule-tag {
    font-size: 11px; padding: 2px 8px; border-radius: 20px; font-weight: 700;
    animation: tagpop 0.3s ease;
  }
  @keyframes tagpop { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  #arena {
    flex: 1; position: relative; overflow: hidden; cursor: crosshair;
    background: radial-gradient(ellipse at center, #0d0d2b 0%, #050510 100%);
  }

  .target {
    position: absolute; border-radius: 50%; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; font-weight: 900; user-select: none;
    transition: transform 0.1s;
    box-shadow: 0 0 20px currentColor;
  }
  .target:hover { transform: scale(1.1); }
  .target.triple-1 { box-shadow: 0 0 10px orange, 0 0 30px orange; }
  .target.triple-2 { box-shadow: 0 0 10px gold, 0 0 30px gold; }

  #overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.85);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    z-index: 100; text-align: center; padding: 20px;
  }
  #overlay.hidden { display: none; }
  #overlay-icon { font-size: 64px; margin-bottom: 10px; animation: bounce 0.6s ease; }
  @keyframes bounce { 0%,100%{transform:scale(1)} 50%{transform:scale(1.3)} }
  #overlay-title { font-size: 36px; font-weight: 900; margin-bottom: 8px; }
  #overlay-desc { font-size: 18px; color: #ccc; max-width: 500px; margin-bottom: 8px; }
  #overlay-quote { font-size: 14px; color: #888; font-style: italic; max-width: 420px; margin-bottom: 20px; }
  #overlay-btn {
    background: #7c3aed; color: #fff; border: none; padding: 14px 40px;
    font-size: 18px; font-weight: 700; border-radius: 8px; cursor: pointer;
    box-shadow: 0 0 20px #7c3aed;
  }
  #overlay-btn:hover { background: #6d28d9; }

  #rule-flash {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; z-index: 90;
    pointer-events: none; text-align: center; padding: 20px;
  }
  #rule-flash.hidden { display: none; }
  #rule-flash-bg { position: absolute; inset: 0; opacity: 0.92; }
  #rule-flash-content { position: relative; z-index: 1; }
  #rule-flash-icon { font-size: 72px; margin-bottom: 10px; }
  #rule-flash-title { font-size: 44px; font-weight: 900; text-shadow: 0 2px 10px rgba(0,0,0,0.5); margin-bottom: 8px; }
  #rule-flash-desc { font-size: 20px; color: #eee; max-width: 500px; margin: 0 auto 8px; }
  #rule-flash-quote { font-size: 14px; color: rgba(255,255,255,0.7); font-style: italic; max-width: 400px; margin: 0 auto; }

  #score-pop {
    position: fixed; font-size: 28px; font-weight: 900; pointer-events: none;
    z-index: 50; animation: floatup 0.8s ease forwards;
  }
  @keyframes floatup { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-60px); } }

  #dpad {
    position: fixed; bottom: 16px; right: 16px;
    display: none; flex-direction: column; align-items: center; gap: 4px; z-index: 10;
  }
  .dpad-row { display: flex; gap: 4px; }
  .dpad-btn {
    width: 44px; height: 44px; background: rgba(124,58,237,0.7);
    border: 1px solid #7c3aed; border-radius: 6px; color: #fff;
    font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center;
  }

  #invert-hint {
    position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%);
    background: rgba(239,68,68,0.9); color: #fff; padding: 6px 18px;
    border-radius: 20px; font-weight: 700; font-size: 13px;
    z-index: 10; display: none;
  }
</style>
</head>
<body>

<div id="topbar">
  <div id="logo">🎭 JOKER NORD</div>
  <div id="score-box">Poeng: <span id="score">0</span></div>
  <div id="timer-box">Tid: <span id="timer">60</span>s</div>
</div>

<div id="rules-bar">
  <span id="rules-label">Aktive regler:</span>
  <div id="active-rules-tags"></div>
</div>

<div id="arena"></div>

<div id="invert-hint">⚠️ Klikk UTENFOR sirkelen!</div>

<div id="overlay">
  <div id="overlay-icon">🎭</div>
  <div id="overlay-title">JOKER NORD</div>
  <div id="overlay-desc">Klikk på sirklene for å samle poeng – men reglene endrer seg hele tiden!</div>
  <div id="overlay-quote">"Regler er til for å brytes... og så endres."<br>– Harald Eia</div>
  <button id="overlay-btn" onclick="startGame()">START SPILLET</button>
</div>

<div id="rule-flash" class="hidden">
  <div id="rule-flash-bg"></div>
  <div id="rule-flash-content">
    <div id="rule-flash-icon"></div>
    <div id="rule-flash-title"></div>
    <div id="rule-flash-desc"></div>
    <div id="rule-flash-quote"></div>
  </div>
</div>

<script>
const arena = document.getElementById('arena');
const scoreEl = document.getElementById('score');
const timerEl = document.getElementById('timer');
const activeRulesTags = document.getElementById('active-rules-tags');
const invertHint = document.getElementById('invert-hint');

let score = 0;
let timeLeft = 60;
let targets = [];
let activeRules = new Set();
let gameRunning = false;
let mainInterval = null;
let ruleInterval = null;
let moveInterval = null;
let targetInterval = null;
let tripleClicks = {};

const RULE_DEFS = [
  {
    id: 'double', label: '×2 Poeng', color: '#10b981', bg: '#064e3b',
    icon: '✌️', title: 'DOBLE POENG!', desc: 'Hvert treff gir dobbelt så mange poeng!',
    quote: '"Mer er mer." – Harald Eia', exclusive: ['quadruple', 'negative', 'half'],
  },
  {
    id: 'quadruple', label: '×4 Poeng', color: '#f59e0b', bg: '#78350f',
    icon: '💰', title: 'FIREDOBLE POENG!', desc: 'KA ER DETTE?! Firedoble poeng på alle treff!',
    quote: '"Noen ganger er reglene bare... greie." – Harald Eia', exclusive: ['double', 'negative', 'half'],
  },
  {
    id: 'negative', label: '➖ Minus-poeng', color: '#ef4444', bg: '#7f1d1d',
    icon: '💀', title: 'MINUS-POENG!', desc: 'Hvert treff trekker nå poeng!',
    quote: '"Dette er ikke min feil." – Harald Eia', exclusive: ['double', 'quadruple'],
  },
  {
    id: 'invert', label: '🔄 Invertert klikk', color: '#8b5cf6', bg: '#2e1065',
    icon: '🔄', title: 'INVERTERT KLIKK!', desc: 'Klikk UTENFOR sirkelen for å score!',
    quote: '"Tenk annerledes... vent, ikke tenk i det hele tatt." – Harald Eia', exclusive: [],
  },
  {
    id: 'triple', label: '3× klikk', color: '#ec4899', bg: '#831843',
    icon: '👆', title: 'TRIPPELKLIKK!', desc: 'Du må klikke tre ganger på samme sirkel!',
    quote: '"Tålmodighet er en dyd. Tilsynelatende." – Harald Eia', exclusive: [],
  },
  {
    id: 'stealth', label: '👻 Usynlig', color: '#6b7280', bg: '#111827',
    icon: '👻', title: 'STEALTH MODUS!', desc: 'Sirklene er nesten usynlige. Finn dem hvis du kan!',
    quote: '"Hva? Jeg ser ingenting." – Harald Eia', exclusive: [],
  },
  {
    id: 'moving', label: '🏃 Beveger seg', color: '#3b82f6', bg: '#1e3a5f',
    icon: '🏃', title: 'BEVEGELIGE MÅL!', desc: 'Sirklene begynner å bevege seg!',
    quote: '"Beveg deg! Eller ikke – det er opp til deg." – Harald Eia', exclusive: [],
  },
  {
    id: 'fast', label: '⚡ Rask tid', color: '#fbbf24', bg: '#451a03',
    icon: '⚡', title: 'RASKERE KLOKKE!', desc: 'Klokken tikker dobbelt så fort!',
    quote: '"Tid er relativ, og nå er den enda mer relativ." – Harald Eia', exclusive: ['slow'],
  },
  {
    id: 'slow', label: '🐌 Sakte tid', color: '#a3e635', bg: '#1a2e05',
    icon: '🐌', title: 'SAKERE KLOKKE!', desc: 'Klokken tikker halvparten så fort. Nyt det.',
    quote: '"Ta det med ro. Eller... nei, kanskje ikke." – Harald Eia', exclusive: ['fast'],
  },
  {
    id: 'bonus', label: '🎁 +100 Bonus', color: '#f472b6', bg: '#500724',
    icon: '🎁', title: 'GRATISPOENG!', desc: 'Du får 100 poeng bare for å være deg!',
    quote: '"Du fortjener dette. Sannsynligvis." – Harald Eia', exclusive: [], once: true,
  },
  {
    id: 'tabula', label: '🧹 Nullstill', color: '#9ca3af', bg: '#111827',
    icon: '🧹', title: 'TABULA RASA!', desc: 'Poengene dine er slettet. Begynn på nytt.',
    quote: '"Alt som er bygget kan rives ned." – Harald Eia', exclusive: [], once: true,
  },
  {
    id: 'half', label: '✂️ Halv score', color: '#f87171', bg: '#450a0a',
    icon: '✂️', title: 'HALV SCORE!', desc: 'Poengene dine er halvert. Beklager.',
    quote: '"Noen ganger er halvparten nok." – Harald Eia', exclusive: ['double', 'quadruple'], once: true,
  },
];

const COLORS = ['#7c3aed','#2563eb','#0891b2','#059669','#d97706','#dc2626','#db2777'];

function getArenaSize() {
  return { w: arena.clientWidth, h: arena.clientHeight };
}

function spawnTarget() {
  if (!gameRunning) return;
  const { w, h } = getArenaSize();
  const size = 48 + Math.random() * 32;
  const x = Math.random() * (w - size);
  const y = Math.random() * (h - size);
  const color = COLORS[Math.floor(Math.random() * COLORS.length)];
  const id = 'T' + Date.now() + Math.random();

  const el = document.createElement('div');
  el.className = 'target';
  el.id = id;
  el.style.width = size + 'px';
  el.style.height = size + 'px';
  el.style.left = x + 'px';
  el.style.top = y + 'px';
  el.style.color = color;
  el.style.background = color + '33';
  el.style.border = '3px solid ' + color;
  applyTargetStyle(el);

  el.addEventListener('click', (e) => { e.stopPropagation(); handleTargetClick(id, el); });

  arena.appendChild(el);

  const obj = { id, el, x, y, size, dx: (Math.random()-0.5)*2, dy: (Math.random()-0.5)*2, clicks: 0 };
  targets.push(obj);

  setTimeout(() => removeTarget(id), 2500 + Math.random() * 2000);
}

function applyTargetStyle(el) {
  if (activeRules.has('stealth')) {
    el.style.opacity = '0.08';
  } else {
    el.style.opacity = '1';
  }
}

function removeTarget(id) {
  const idx = targets.findIndex(t => t.id === id);
  if (idx === -1) return;
  const t = targets[idx];
  t.el.remove();
  targets.splice(idx, 1);
  delete tripleClicks[id];
}

function handleTargetClick(id, el) {
  if (!gameRunning) return;

  if (activeRules.has('triple')) {
    tripleClicks[id] = (tripleClicks[id] || 0) + 1;
    const n = tripleClicks[id];
    el.className = 'target triple-' + Math.min(n, 2);
    el.textContent = n < 3 ? n : '';
    if (n < 3) return;
  }

  let pts = 10;
  if (activeRules.has('quadruple')) pts *= 4;
  else if (activeRules.has('double')) pts *= 2;
  if (activeRules.has('negative')) pts = -Math.abs(pts);

  addScore(pts, el);
  removeTarget(id);
}

function handleArenaClick(e) {
  if (!gameRunning) return;
  if (!activeRules.has('invert')) return;
  if (e.target !== arena) return;

  let pts = 10;
  if (activeRules.has('quadruple')) pts *= 4;
  else if (activeRules.has('double')) pts *= 2;
  addScore(pts, null, e.clientX, e.clientY);
}

arena.addEventListener('click', handleArenaClick);

function addScore(pts, el, cx, cy) {
  score = Math.max(0, score + pts);
  scoreEl.textContent = score;

  const x = cx ?? (el ? parseInt(el.style.left) + parseInt(el.style.width)/2 : arena.clientWidth/2);
  const y = cy ?? (el ? parseInt(el.style.top) : arena.clientHeight/2);

  const pop = document.createElement('div');
  pop.id = 'score-pop';
  pop.style.left = x + 'px';
  pop.style.top = (y + arena.getBoundingClientRect().top - 60) + 'px';
  pop.style.color = pts >= 0 ? '#10b981' : '#ef4444';
  pop.textContent = (pts >= 0 ? '+' : '') + pts;
  document.body.appendChild(pop);
  setTimeout(() => pop.remove(), 800);
}

function updateActiveRuleTags() {
  activeRulesTags.innerHTML = '';
  if (activeRules.size === 0) {
    activeRulesTags.innerHTML = '<span style="color:#555;font-size:12px">Ingen spesielle regler nå</span>';
    return;
  }
  activeRules.forEach(id => {
    const def = RULE_DEFS.find(r => r.id === id);
    if (!def) return;
    const tag = document.createElement('span');
    tag.className = 'rule-tag';
    tag.style.background = def.bg;
    tag.style.color = def.color;
    tag.style.border = '1px solid ' + def.color;
    tag.textContent = def.label;
    activeRulesTags.appendChild(tag);
  });
}

let usedOnce = new Set();

function triggerRandomRule() {
  if (!gameRunning) return;

  const available = RULE_DEFS.filter(r => {
    if (r.once && usedOnce.has(r.id)) return false;
    return true;
  });
  if (available.length === 0) return;

  const def = available[Math.floor(Math.random() * available.length)];

  if (def.once) usedOnce.add(def.id);

  if (def.id === 'bonus') {
    score += 100;
    scoreEl.textContent = score;
  } else if (def.id === 'tabula') {
    score = 0;
    scoreEl.textContent = score;
  } else if (def.id === 'half') {
    score = Math.floor(score / 2);
    scoreEl.textContent = score;
  }

  if (!def.once) {
    def.exclusive.forEach(eid => activeRules.delete(eid));

    if (activeRules.has(def.id)) {
      activeRules.delete(def.id);
    } else {
      activeRules.add(def.id);
    }
  }

  updateActiveRuleTags();
  applyRuleEffects();
  showRuleFlash(def);
}

function applyRuleEffects() {
  targets.forEach(t => applyTargetStyle(t.el));
  invertHint.style.display = activeRules.has('invert') ? 'block' : 'none';
}

function showRuleFlash(def) {
  const flash = document.getElementById('rule-flash');
  const flashBg = document.getElementById('rule-flash-bg');
  document.getElementById('rule-flash-icon').textContent = def.icon;
  document.getElementById('rule-flash-title').textContent = def.title;
  document.getElementById('rule-flash-desc').textContent = def.desc;
  document.getElementById('rule-flash-quote').textContent = def.quote;
  flashBg.style.background = def.bg;
  flash.classList.remove('hidden');
  setTimeout(() => flash.classList.add('hidden'), 2200);
}

function moveTargets() {
  if (!activeRules.has('moving')) return;
  const { w, h } = getArenaSize();
  targets.forEach(t => {
    t.x += t.dx * 2;
    t.y += t.dy * 2;
    if (t.x < 0 || t.x > w - t.size) t.dx *= -1;
    if (t.y < 0 || t.y > h - t.size) t.dy *= -1;
    t.x = Math.max(0, Math.min(w - t.size, t.x));
    t.y = Math.max(0, Math.min(h - t.size, t.y));
    t.el.style.left = t.x + 'px';
    t.el.style.top = t.y + 'px';
  });
}

function startGame() {
  document.getElementById('overlay').classList.add('hidden');
  score = 0;
  timeLeft = 60;
  scoreEl.textContent = '0';
  timerEl.textContent = '60';
  activeRules.clear();
  usedOnce.clear();
  tripleClicks = {};
  targets.forEach(t => t.el.remove());
  targets = [];
  gameRunning = true;
  updateActiveRuleTags();
  invertHint.style.display = 'none';

  targetInterval = setInterval(spawnTarget, 900);
  moveInterval = setInterval(moveTargets, 30);

  let tickCount = 0;
  let nextRuleTick = 8 + Math.floor(Math.random() * 6);

  mainInterval = setInterval(() => {
    const fastMult = activeRules.has('fast') ? 2 : activeRules.has('slow') ? 0.5 : 1;
    timeLeft = Math.max(0, timeLeft - fastMult);
    timerEl.textContent = Math.ceil(timeLeft);

    tickCount++;
    if (tickCount >= nextRuleTick) {
      triggerRandomRule();
      tickCount = 0;
      nextRuleTick = 8 + Math.floor(Math.random() * 7);
    }

    if (timeLeft <= 0) endGame();
  }, 1000);
}

function endGame() {
  gameRunning = false;
  clearInterval(mainInterval);
  clearInterval(targetInterval);
  clearInterval(moveInterval);
  targets.forEach(t => t.el.remove());
  targets = [];
  invertHint.style.display = 'none';

  const overlayIcon = document.getElementById('overlay-icon');
  const overlayTitle = document.getElementById('overlay-title');
  const overlayDesc = document.getElementById('overlay-desc');
  const overlayQuote = document.getElementById('overlay-quote');
  const overlayBtn = document.getElementById('overlay-btn');

  let rating = '';
  if (score >= 500) rating = '🏆 Legendarisk!';
  else if (score >= 300) rating = '🥇 Imponerende!';
  else if (score >= 150) rating = '🥈 Bra jobba!';
  else if (score >= 50) rating = '🥉 Ikke verst...';
  else rating = '😅 Du prøvde i alle fall.';

  overlayIcon.textContent = '🎭';
  overlayTitle.textContent = `Spillet er over! ${rating}`;
  overlayDesc.textContent = `Du endte opp med ${score} poeng.`;
  overlayQuote.textContent = '"Reglene endret seg, og det gjorde du også." – Harald Eia';
  overlayBtn.textContent = 'SPILL IGJEN';
  document.getElementById('overlay').classList.remove('hidden');
}
</script>
</body>
</html>
